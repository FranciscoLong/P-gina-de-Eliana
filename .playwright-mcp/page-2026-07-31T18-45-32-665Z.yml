        - heading "Escribana y Rematadora" [level=2] [ref=f38e32]
        - paragraph [ref=f38e33]: Soy Escribana Pública, egresada de la Universidad de la República en 2018, y Rematadora, graduada en el Instituto Aldey en 2017.
        - paragraph [ref=f38e34]: Entiendo que detrás de cada trámite notarial o negocio inmobiliario hay decisiones importantes. Por eso, mi compromiso es brindarte un asesoramiento claro, cercano y responsable, garantizando la seriedad y confianza que necesitas para avanzar con absoluta tranquilidad.
        - paragraph [ref=f38e35]: La combinación de mi formación notarial y mi visión como rematadora me permite ofrecerte un respaldo integral, cuidando cada detalle de tu operación de principio a fin.
