<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviso de cierre por la mañana</title>
  <!--
    Cartel A4 para imprimir, con el mismo diseño que aviso-reservas.html. El
    PDF se genera igual (ver README, "Enlace para carteles"). Lo que más se
    tiene que ver es que por la mañana está cerrado y por la tarde se atiende
    como siempre.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Handlee&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
  >
  <style>
    :root {
      --green-950: #055126;
      --green-900: #087535;
      --green-100: #e6f2eb;
      --red-700: #b50d11;
      --black: #141414;
      --gray-700: #4f4f4f;
      --gray-500: #777;
      --gray-200: #e5e5e5;
      --white: #fff;
    }

    @page {
      size: A4;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--gray-200);
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--black);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet {
      display: flex;
      flex-direction: column;
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      padding: 15mm 16mm 13mm;
      overflow: hidden;
      background: var(--white);
    }

    @media screen {
      .sheet {
        margin: 10mm auto;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.18);
      }
    }

    @media print {
      html,
      body {
        background: var(--white);
      }
    }

    /* Marca */
    .brand {
      display: flex;
      align-items: center;
      gap: 4mm;
      padding-bottom: 6mm;
      border-bottom: 0.4mm solid var(--gray-200);
    }

    .brand img {
      width: 16mm;
      height: 16mm;
    }

    .brand strong {
      display: block;
      font-family: "Handlee", cursive;
      font-size: 19pt;
      font-weight: 400;
      line-height: 1.1;
    }

    .brand span {
      color: var(--gray-500);
      font-size: 9pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Mensaje principal: lo que se tiene que leer de lejos. */
    .notice {
      padding: 16mm 0 14mm;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 4mm;
      padding: 1.6mm 5mm;
      border-radius: 99px;
      color: var(--white);
      background: var(--red-700);
      font-size: 13pt;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .notice .start {
      margin: 0 0 3mm;
      color: var(--black);
      font-size: 21pt;
      font-weight: 600;
      line-height: 1.2;
    }

    .notice h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 80pt;
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.01em;
    }

    .notice h1 em {
      display: block;
      color: var(--red-700);
      font-style: normal;
    }

    .notice .hours {
      margin-top: 5mm;
      color: var(--gray-700);
      font-size: 17pt;
      line-height: 1.35;
    }

    .notice .hours strong {
      color: var(--black);
    }

    /* Horario de la tarde: lo que sigue igual. */
    .afternoon {
      padding: 10mm 12mm;
      border-radius: 6mm;
      background: var(--green-100);
      text-align: center;
    }

    .afternoon h2 {
      margin-bottom: 4mm;
      color: var(--green-950);
      font-family: "Cormorant Garamond", serif;
      font-size: 34pt;
      font-weight: 700;
      line-height: 1.05;
    }

    .afternoon p {
      font-size: 17pt;
      line-height: 1.35;
    }

    .afternoon .time {
      display: block;
      margin-top: 2mm;
      color: var(--green-900);
      font-size: 30pt;
      font-weight: 700;
    }

    /* Contacto */
    .fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4mm;
      margin-top: auto;
      padding-top: 7mm;
      border-top: 0.4mm solid var(--gray-200);
      font-size: 15pt;
      line-height: 1.3;
    }

    .fallback svg {
      flex: none;
      width: 11mm;
      height: 11mm;
      color: var(--green-900);
    }

    .fallback strong {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="brand">
      <img src="../assets/logo-isbarbo-gfeller.webp" alt="Logo de Eliana Isbarbo Gfeller">
      <div>
        <strong>Eliana Isbarbo Gfeller</strong>
        <span>Escribana Pública</span>
      </div>
    </header>

    <section class="notice">
      <span class="eyebrow">Aviso</span>
      <p class="start">Del lunes 2 al lunes 23 de noviembre</p>
      <h1>Por la mañana, <em>el escritorio permanecerá cerrado</em></h1>
    </section>

    <section class="afternoon">
      <h2>Por la tarde, atendemos como siempre</h2>
      <p>De lunes a viernes
        <span class="time">15:00 a 19:00</span>
      </p>
    </section>

    <footer class="fallback">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </svg>
      <p>¿Tenés alguna consulta?<br>Escribinos por WhatsApp al <strong>091 048 471</strong></p>
    </footer>
  </main>
</body>
</html>
